<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>* { box-sizing:border-box }
:root { color-scheme:light; --ink:#202d25; --green:#244a38; --gold:#e0ba82; --paper:#f7f4eb; --line:#d7d7c8 }
body { margin:0; font:16px/1.8 Tahoma,Arial,sans-serif; color:var(--ink); background:var(--paper) }
header,footer { background:#192c23; color:#fff }
nav,main { max-width:1160px; margin:auto }
nav { display:flex; justify-content:space-between; align-items:center; padding:18px 5%; gap:15px }
nav div { display:flex; gap:18px } a { color:var(--green) }
nav a { color:#fff; text-decoration:none } a:hover { text-decoration:underline }
.brand { font-size:22px; font-weight:bold }.brand small { display:block; font:10px/1.3 Georgia; letter-spacing:2px; color:var(--gold) }
main { padding:0 5%; min-height:75vh }
section { padding:42px 0; border-bottom:1px solid var(--line) }
h1,h2,h3 { line-height:1.4; margin:.3em 0 .7em }
h1 { font-size:clamp(34px,5vw,64px) } h2 { font-size:clamp(25px,3vw,38px) }
p { max-width:68ch } small { color:#756044; font-weight:bold }
.hero,.split,.stats,.grid { display:grid; gap:20px }.hero,.split { grid-template-columns:1fr 1fr }
.hero { align-items:center; gap:5%; padding-top:40px }.hero h1 { font-size:clamp(46px,7vw,82px) }
.photo { min-height:380px; border-radius:140px 140px 8px 8px; background:linear-gradient(0deg,#16271fe6,#243d3214),url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=900&q=80') center/cover,#44584b; display:grid; align-items:end; padding:30px; direction:ltr; color:#eed4ab;font:24px/1 Georgia;letter-spacing:3px }
.stats,.grid { grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr)); margin:20px 0 }
.stats strong { font-size:32px }.stats h3 { font-size:15px }
article,details { padding:22px; background:#fffdf7; border:1px solid var(--line); border-radius:12px; overflow-wrap:anywhere }
details { margin:12px 0 } summary { cursor:pointer; font-weight:bold }
button,.btn { display:inline-block; background:var(--green); color:white; font:inherit; font-weight:bold; text-decoration:none; border:none; border-radius:7px; padding:10px 20px; margin:8px 0; cursor:pointer }
button:hover,.btn:hover { background:#153b29 } form { margin:10px 0 20px } label { display:block; margin:10px 0; font-weight:bold }
input:not([type=radio]):not([type=checkbox]),select { font:inherit; width:100%; padding:9px 12px; border-radius:6px; border:1px solid #a5afa0; background:white }
fieldset { border:1px solid var(--line); border-radius:6px; margin:12px 0 }.times { display:flex; flex-wrap:wrap; gap:6px }
.times label { border:1px solid var(--line); border-radius:6px; padding:4px 9px; margin:0; cursor:pointer }
.times label:has(:checked) { background:#dceada; border-color:var(--green) }
footer { text-align:center; padding:22px } .notice { background:#f1e1c4; padding:12px }.narrow { max-width:560px; margin:auto }
@media(max-width:700px){.split,.hero{grid-template-columns:1fr}.photo{min-height:220px}.hero{gap:15px}nav{padding-inline:4%}nav div{gap:10px;font-size:14px}section{padding:28px 0}}


/* Navigation and form controls */
:root { --line:#d8dacf; --paper:#f6f5ef; --muted:#59675e; --tint:#edf3e9 }
body { font-family:"Segoe UI",Tahoma,Arial,sans-serif }
header { border-bottom:3px solid #b69864 }
header nav { flex-wrap:wrap; padding-block:14px }
nav .brand { display:inline-flex; align-items:center; gap:12px; line-height:1.4; text-decoration:none }
.brand-icon { display:grid; place-items:center; width:43px; height:43px; border:1px solid #8c865f; border-radius:12px; color:#ecd1a1 }
nav .nav-links { display:flex; flex-wrap:wrap; gap:4px }
.nav-links a,.tabbar a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 17px; border-radius:8px; font-weight:600; text-decoration:none }
.nav-links a:hover { background:#314b3f }
.nav-links a[aria-current] { background:#eed8af; color:#29372c }
.skip { position:absolute; top:-100px; z-index:10; padding:8px; background:white }
.skip:focus { top:0 }
:focus-visible { outline:3px solid #a86b24; outline-offset:3px }
section h1 { letter-spacing:-.025em }
article { box-shadow:0 6px 20px #23352408; border-radius:17px }
button,.btn { border-radius:9px; min-height:44px }
fieldset, article, .selection, .booking-layout > * { min-width:0 }
input,select { accent-color:var(--green) }
input:not([type=radio]):not([type=checkbox]),select { min-height:46px; margin-top:5px; border-color:#a7b2a8; border-radius:9px }
input[type=date],input[type=tel],input[type=number] { text-align:start; direction:ltr }
.group { border:0; padding:0; margin:0 0 24px }
.group legend { font-size:1.15rem; font-weight:700; margin-bottom:10px; padding:0 }
.booking-screen { max-width:960px; margin:auto }
.booking-screen h1,.dash-head h1 { font-size:clamp(32px,4vw,50px) }
.steps { padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:12px; margin-bottom:26px; color:var(--muted) }
.steps li { display:flex; align-items:center; gap:12px }
.steps li+li::before { content:"‹"; color:#81877a }
.steps [aria-current] { color:var(--green); font-weight:750; text-decoration:underline; text-decoration-color:#aa854b; text-underline-offset:7px }
.booking-panel { padding:clamp(18px,3vw,32px) }
.booking-panel form { margin:0 }
.booking-panel > h2 { margin-bottom:0; font-size:1.55rem }
.muted { color:var(--muted); margin-top:2px }
.choices { display:grid; gap:9px; grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr)) }
.choice,.slots label { cursor:pointer; border:1px solid var(--line); border-radius:10px; background:white; display:flex; align-items:center; gap:10px; padding:12px; margin:0; min-height:48px }
.choice small { display:block; font-weight:500; color:var(--muted) }
.choice input,.slots input { width:16px; height:16px; flex:none; margin:0 }
.choice:has(:checked),.slots label:has(:checked),.times label:has(:checked) { background:var(--tint); border-color:#356548; box-shadow:inset 0 0 0 1px #356548 }
.choice:focus-within,.slots label:focus-within { outline:2px solid #a86b24; outline-offset:2px }
.booking-layout { display:grid; grid-template-columns:minmax(210px,1fr) minmax(0,2fr); gap:18px; align-items:start }
.selection { border:1px solid #d1d7c8; padding:24px; background:#e8ece2; border-radius:16px }
.selection h2 { margin-bottom:0 }.selection p { margin-top:3px }
.selection hr { border:0; border-top:1px solid #c3cebf; margin:20px 0 }
.selection form { margin-bottom:0 }
.slots { display:grid; grid-template-columns:repeat(auto-fit,minmax(99px,1fr)); gap:8px }
.slots label { justify-content:center; font-size:.94rem }
.contact { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.tabbar { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); padding-bottom:10px }
.tabbar a:hover { background:#e7ece3 }
.tabbar a[aria-current] { color:white; background:var(--green) }
.dash-head { display:flex; justify-content:space-between; align-items:center; gap:12px; border:0; padding-bottom:12px }
.dash-head form { margin:0 }
.dash-head button,.date-filter .btn { background:transparent; color:var(--green); border:1px solid #a4b1a5 }
.dash-section { padding-top:18px }
.stats article { border-top:3px solid #b79961 }.stats h3 { color:var(--muted) }
.date-filter { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end }
.date-filter label,.date-filter button,.date-filter .btn { margin:0 }
.status { display:inline-block; border-radius:16px; padding:2px 10px; background:#e1eee2; color:#24482d }
.status-cancelled,.status-absent { background:#f6e3de; color:#7d3328 }
.reply { font-size:.85rem; color:var(--muted) }
summary { padding:6px; color:var(--green) }
details[open] > summary { border-bottom:1px solid var(--line); margin-bottom:14px }
@media(max-width:700px){
 .booking-layout,.contact { grid-template-columns:1fr }
 .choices { grid-template-columns:1fr }
 .choice { padding:10px 14px }.choice span { display:flex; flex-grow:1; justify-content:space-between; gap:8px }
 .nav-links a,.tabbar a { padding:7px 10px }
 .brand-icon { display:none }
 .steps { font-size:.9rem; gap:8px }
 .date-filter label { width:100% }
}
/* Shared palette and navigation */
:root { --ink:#f6f3ed; --paper:#131313; --green:#ecd397; --line:#494238; --muted:#c5bfb5; --surface:#201e1b; --gold:#e6c57d; --tint:#3f372a; color-scheme:dark }
:root[data-theme=light] { --ink:#27241e; --paper:#faf7f1; --green:#64480e; --line:#cfc6b7; --muted:#615b52; --surface:#fffdf8; --tint:#f1e9d8; color-scheme:light }
body { background:var(--paper); color:var(--ink) }
.mast { background:#151411; border-bottom:1px solid #ffffff29; position:relative; z-index:5 }
.mast nav { max-width:1410px; padding:14px clamp(16px,5vw,78px); flex-wrap:nowrap }
nav .brand { color:#efd396; white-space:nowrap }
.brand-icon { border-color:#bba06680; font:24px Georgia; width:45px;height:45px;display:grid }
.brand small { letter-spacing:.19em; color:#ded5be; font-weight:600 }
nav .header-actions,.cover-actions { display:flex; gap:10px; align-items:center }
.gold-action,.outline-action { display:inline-flex; align-items:center; justify-content:center; gap:14px; padding:10px 22px; border-radius:99px; font-weight:700; min-height:44px; text-decoration:none }
.gold-action,button,.btn,.tabbar a[aria-current] { color:#231b0e; background:linear-gradient(110deg,#eed39a,#ca9b48 62%,#e5bf77) }
.gold-action:hover,button:hover,.btn:hover { color:#17120b; background:#efd293; text-decoration:none }
.theme-toggle,.menu summary { width:44px;height:44px; background:#13131375; border:1px solid #ffffff55;color:#f1dfb7;border-radius:50%;display:grid;place-items:center;padding:0;margin:0; font-size:23px }
.theme-toggle[hidden] {display:none}
.menu { border:0; padding:0; margin:0; background:transparent;position:relative; overflow:visible }
.menu summary { list-style:none; cursor:pointer }.menu summary::-webkit-details-marker { display:none }
.menu[open] > summary { margin:0;border:1px solid var(--gold) }
.menu i { width:17px;height:13px;border-block:1px solid currentColor;display:grid;align-items:center }
.menu i:before { content:'';border-top:1px solid currentColor }
nav .menu-items { position:absolute; inset-inline-end:0; top:54px; display:grid; gap:2px; min-width:172px; padding:8px; border:1px solid #5f5240; border-radius:14px; background:#211e19; box-shadow:0 12px 30px #0005 }
.menu-items a { padding:8px 12px; border-radius:7px }.menu-items a:hover { background:#383228 }

</style><body><script>const minute=60000, live=false;

function slots(id,d,day,ignore=0){const b=one('',id),base=Date.parse(day+'T00:00:00+03:00');const result=[];if(!b.days?.includes(String(new Date(day+'T12:00Z').getUTCDay())))return result;for(let n=b.opens;n+d<=b.closes;n+=30){const t=base+n*minute;if(t>Date.now()&&!data.rows.some(r=>r.id!==ignore&&r.barber===id&&r.status==='booked'&&t<r.start+r.minutes*minute&&t+d*minute>r.start))result.push(t);}return result;}

  return `<header class="mast"><nav aria-label="القائمة الرئيسية">

    <div class="header-actions"><button class="theme-toggle" type="button" aria-label="تغيير المظهر" hidden>☼</button>
    <a class="gold-action" href="/book">احجز موعدك <span aria-hidden="true">←</span></a>
    <details class="menu"><summary aria-label="قائمة التنقل"><i></i></summary><div class="menu-items">
    <a href="/">الرئيسية</a><a href="/#services">الخدمات</a><a href="/#team">الحلاقون</a><a href="/#visit">قبل زيارتك</a><a href="/staff">دخول الفريق</a></div></details></div></nav></header>`;

}
function page(title, html) {
  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+' | صالون آدم</title><link rel="stylesheet" href="/style.css"><script src="/theme.js" defer><\/script></head><body class="'+(title==='الرئيسية'?'salon-home':'salon-app')+'"><a class="skip" href="#content">تخطَّ إلى المحتوى</a>'+navigation(title)+'<main id="content">'+html+'</main><footer>صالون آدم ✂ · جميع المواعيد بتوقيت الرياض'+(live?'':' · نسخة تدريب محلية')+'</footer></body></html>';
}
function form(action,content,button){return '<form method="post" action="'+action+'">'+content+'<button>'+button+'</button></form>';}
const input=(label,name,type='text',value='',extra='')=>'<label>'+label+'<input required type="'+type+'" name="'+name+'" value="'+esc(value)+'" '+extra+'></label>';
const card=(title,body)=>'<article><h3>'+esc(title)+'</h3>'+body+'</article>';
const grid=items=>'<div class="grid">'+items.join('')+'</div>';
const link=(href,label)=>'<a class="btn" href="'+esc(href)+'">'+esc(label)+'</a>';
const desc=['قصّة تناسب شكل وجهك وروتينك اليومي.','تحديد خطوط اللحية وتهذيب طولها.','قصّة وتهذيب متكاملان في جلسة واحدة.'];
function landing() {
  const menu=services(), team=staffList();
  const serviceCards=menu.map(s=>card(s.name,'<p>'+esc(desc[s.id-1]||'اختر الخدمة عند تحديد موعدك.')+'</p><b>'+s.duration+' دقيقة</b>'));
  const teamCards=team.map(b=>card(b.name,link('/book?barber='+b.id,'اختَر موعدًا مع '+b.name+' ←')));
  return page('الرئيسية', `<section class="cover"><div class="wrap cover-copy">
    <small class="overline">صالون آدم للحلاقة الرجالية</small><h1>حلاقك المفضّل،<em>في وقتك.</em></h1>
    <p>قصّ شعر، تهذيب لحية، أو الاثنين معًا. اختر حلاقك واحجز الوقت اللي يناسب يومك.</p>
    <div class="cover-actions"><a class="gold-action" href="/book">احجز موعدك ←</a><a class="outline-action" href="#services">اكتشف خدماتنا</a></div>
    </div></section>
    <section class="home-section about"><div class="wrap spread"><div><small class="overline">عن صالون آدم</small><h2>قصّة تبدأ<em>من حديثك مع الحلاق.</em></h2></div>
    <div><p>تحب التدرّج خفيف؟ أو عندك صورة للقصّة اللي في بالك؟ ابدأ زيارتك بالكلام عن التفاصيل، وخذ وقتك مع حلاقك.</p>
    <div class="facts"><div><b>${team.length}</b> حلاقين</div><div><b>${menu.length}</b> خدمات متاحة</div></div></div></div></section>
    <section class="home-section" id="services"><div class="wrap"><small class="overline">خدماتنا</small><h2>وش تحتاج في زيارتك؟</h2>${grid(serviceCards)}</div></section>
    <section class="home-section" id="team"><div class="wrap"><small class="overline">فريق الصالون</small><h2>احجز مع حلاقك</h2>${grid(teamCards)}</div></section>
    <section class="home-section visit" id="visit"><div class="wrap spread"><div><small class="overline">قبل زيارتك</small><h2>موعدك<em>بثلاث خطوات.</em></h2><a class="gold-action" href="/book">ابدأ الحجز ←</a></div>
    <ol class="visit-steps"><li><strong>اختر حلاقك وخدمتك</strong><p>مدة كل خدمة ظاهرة بجانب اسمها.</p></li><li><strong>حدّد اليوم والوقت</strong><p>تظهر الفترات المتاحة التي تكفي لخدمتك.</p></li><li><strong>أكّد رقم جوالك</strong><p>بعد التحقق يصلك رابط لإدارة الموعد. تقدر تعدّل أو تلغي إذا بقيت ساعة أو أكثر.</p></li></ol></div></section>`);
}
function dateInput(day){return input('التاريخ','day','date',day,'min="'+dayOf(Date.now())+'" max="'+dayOf(Date.now()+60*86400000)+'"');}
const calendarLabel = day => new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {
  weekday:'long', day:'numeric', month:'long', timeZone:'Asia/Riyadh'
}).format(new Date(day+'T12:00:00+03:00'));

function choiceList(title, name, items, selected, subtitle) {
  const cards = items.map(item => '<label class="choice"><input required type="radio" name="'+name+'" value="'+item.id+'" '+(Number(selected)===item.id?'checked':'')+'><span><strong>'+esc(item.name)+'</strong>'+subtitle(item)+'</span></label>');
  return '<fieldset class="group"><legend>'+title+'</legend><div class="choices">'+cards.join('')+'</div></fieldset>';
}
const radioTimes = times => '<fieldset class="group"><legend>الأوقات المتاحة</legend><div class="times slots">'+times.map(t=>'<label><input required type="radio" name="start" value="'+t+'"><span>'+timeText(t)+'</span></label>').join('')+'</div></fieldset>';
function book(p) {
  const team=staffList(), menu=services();
  const barber=team.find(b=>b.id===+p.barber), service=menu.find(s=>s.id===+p.service);
  const today=dayOf(Date.now()), requested=p.day||today;
  const day=/^\d{4}-\d{2}-\d{2}$/.test(requested)&&Number.isFinite(Date.parse(requested+'T12:00:00Z'))?requested:today;
  const showTimes=barber&&service&&p.edit!=='1';
  const steps='<ol class="steps">'+['الحلاق والخدمة','وقت الموعد','تأكيد الجوال'].map((name,i)=>'<li '+(i===(showTimes?1:0)?'aria-current="step"':'')+'>'+name+'</li>').join('')+'</ol>';
  let panel;
  if(!showTimes) {
    const barbers=choiceList('اختر حلاقك','barber',team,p.barber,()=> '');
    const treatments=choiceList('الخدمة','service',menu,p.service,s=>'<small>'+s.duration+' دقيقة</small>');
    panel='<article class="booking-panel"><form action="/book">'+barbers+treatments+dateInput(day)+'<button>عرض الأوقات المتاحة ←</button></form></article>';
  } else {
    const query='/book?barber='+barber.id+'&amp;service='+service.id+'&amp;day=';
    const free=slots(barber.id,service.duration,day);
    const filters='<aside class="selection"><small>اختياراتك</small><h2>'+esc(barber.name)+'</h2><p>'+esc(service.name)+' · '+service.duration+' دقيقة</p><a href="'+query+esc(day)+'&amp;edit=1">تغيير الحلاق أو الخدمة</a><hr><form>'+hidden('barber',barber.id)+hidden('service',service.id)+dateInput(day)+'<button>عرض التاريخ</button></form></aside>';
    const fields=hidden('barber',barber.id)+hidden('service',service.id)+radioTimes(free)+'<div class="contact">'+input('اسم الزبون','customer','text','','maxlength="80" autocomplete="given-name"')+input('رقم الجوال','phone','tel','','placeholder="05xxxxxxxx" autocomplete="tel"')+'</div>';
    panel='<div class="booking-layout">'+filters+'<article class="booking-panel"><h2>'+esc(calendarLabel(day))+'</h2><p class="muted">بتوقيت الرياض</p>'+(free.length?form('/challenge',fields,'متابعة للتحقق من الجوال ←'):'<p class="notice">لا توجد فترة متاحة تكفي للخدمة في هذا اليوم. اختر تاريخًا آخر.</p>')+'</article></div>';
  }
  return page('احجز موعدك','<section class="booking-screen"><h1>احجز موعدك</h1>'+steps+panel+'</section>');
}
const states={booked:'محجوز',cancelled:'ملغي',done:'مكتمل',absent:'لم يحضر'};
const replies={yes:'أكد الحضور',unanswered:'لم يرد',pending:'لم يُرسل تذكير'};
const dayNames=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function management(b,u,day){const fields=hidden('id',b.id)+(u?'':hidden('k',b.secret)),staff=!!u;
 const open=b.status==='booked',canMove=open&&(staff||b.start-Date.now()>=60*minute);
 const summary='<h1>حجز رقم '+b.id+'</h1><article><h2>'+esc(b.service)+'</h2><p>'+esc(one('SELECT name FROM staff WHERE id=?',b.barber).name)+' · '+when(b.start)+' · '+b.minutes+' دقيقة</p><p>'+states[b.status]+' · '+replies[b.reply]+'</p></article>';
 const confirm=open&&b.start>Date.now()&&!staff&&b.reply!=='yes'?form('/change',fields+hidden('action','confirm'),'تأكيد حضوري'):'';
 const dest=staff?'/appointment?id='+b.id:'/manage?k='+b.secret;
 let change='';if(canMove){day=day||dayOf(Math.max(b.start,Date.now()));const times=slots(b.barber,b.minutes,day,b.id).filter(t=>t!==b.start);
 change='<article><h2>تأجيل أو تغيير الموعد</h2><form action="'+dest.split('?')[0]+'">'+fields+dateInput(day)+'<button>عرض الأوقات</button></form>'+(times.length?form('/change',fields+hidden('action','move')+radioTimes(times),'حفظ الموعد الجديد'):'<p>اختر تاريخًا آخر لعرض الأوقات.</p>')+'</article><details><summary>إلغاء الموعد</summary>'+form('/change',fields+hidden('action','cancel'),'تأكيد إلغاء الحجز')+'</details>';}
 return page('إدارة الحجز','<section>'+summary+confirm+change+(open&&!canMove?'<p>للتعديل خلال الساعة الأخيرة تواصل مع الصالون.</p>':'')+(staff&&open&&b.start<=Date.now()?form('/change',fields+hidden('action','done'),'اكتمل الموعد')+form('/change',fields+hidden('action','absent'),'لم يحضر الزبون'):'')+'</section>');}
function schedule(b){const days=dayNames.map((n,i)=>'<label><input type="checkbox" name="d'+i+'" '+(b.days.includes(String(i))?'checked':'')+'> '+n+'</label>').join('');
 const choices=(sel)=>Array.from({length:49},(_,i)=>'<option value="'+i*30+'" '+(i*30===sel?'selected':'')+'>'+String(i>>1).padStart(2,'0')+':'+(i%2?'30':'00')+'</option>').join('');
 return form('/schedule',hidden('id',b.id)+'<fieldset><legend>أيام الدوام</legend><div class="times">'+days+'</div></fieldset><label>من<select name="opens">'+choices(b.opens)+'</select></label><label>إلى<select name="closes">'+choices(b.closes)+'</select></label>','حفظ الدوام');}
function dashboard(u,p){const owner=u.role==='owner',day=p.day||dayOf(Date.now()),bList=owner?staffList():[u];
 const rows=all('SELECT a.*,s.name AS stylist FROM bookings a JOIN staff s ON s.id=a.barber WHERE '+(owner?'1=1':'a.barber='+Number(u.id))+' ORDER BY a.start');
 const shown=rows.filter(b=>p.range==='all'||dayOf(b.start)===day);
 const tabs=owner?[['bookings','الحجوزات'],['team','الفريق والدوام'],['settings','إدارة الصالون']]:[['bookings','مواعيدي'],['team','أوقات تواجدي']];
 const tab=tabs.some(([id])=>id===p.tab)?p.tab:'bookings';
 let html='<section class="dash-head"><div><small>'+esc(u.name)+'</small><h1>'+(owner?'لوحة المالك':'لوحة الحلاق')+'</h1></div>'+form('/logout','','تسجيل الخروج')+'</section>';
 html+='<div class="tabbar" role="navigation" aria-label="أقسام لوحة التحكم">'+tabs.map(([id,label])=>'<a href="?tab='+id+'" '+(tab===id?'aria-current="page"':'')+'>'+label+'</a>').join('')+'</div>';
 if(tab==='bookings') html+='<section class="dash-section">'+'<div class="stats">'+[['مواعيد اليوم',rows.filter(b=>dayOf(b.start)===dayOf(Date.now())&&b.status!=='cancelled').length],['مواعيد قادمة',rows.filter(b=>b.start>Date.now()&&b.status==='booked').length],['بانتظار رد',rows.filter(b=>b.start>Date.now()&&b.reply==='unanswered'&&b.status==='booked').length]].map(([k,v])=>card(k,'<strong>'+v+'</strong>')).join('')+'</div><h2>الحجوزات</h2><form class="date-filter"><label>تاريخ الموعد<input type="date" name="day" value="'+esc(day)+'"></label><button>عرض اليوم المحدد</button> '+link('?range=all','كل الحجوزات')+'</form>'+grid(shown.map(b=>card(b.customer,'<p>'+esc(b.stylist)+' · '+esc(b.service)+'<br>'+when(b.start)+'<br><a dir="ltr" href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a></p><span class="status status-'+b.status+'">'+states[b.status]+'</span> <span class="reply">'+replies[b.reply]+'</span><p>'+link('/appointment?id='+b.id,'تفاصيل وإدارة')+'</p>')))+(shown.length?'':'<p>ما فيه حجوزات في هذا العرض.</p>')+'</section>';
 if(tab==='team') html+='<section class="dash-section"><h2>'+(owner?'الفريق والدوام':'أوقات تواجدي')+'</h2>'+grid(bList.map(b=>card(b.name,schedule(b)+(owner?'<details><summary>إعدادات الحلاق</summary>'+form('/staff-edit',hidden('id',b.id)+input('الاسم','name','text',b.name)+'<label>كلمة مرور جديدة (اختياري)<input type="password" name="pass" minlength="12"></label>','تحديث')+form('/archive',hidden('id',b.id),'إزالة من الفريق')+'</details>':''))))+'</section>';
 if(owner&&tab==='settings'){html+='<section class="dash-section"><h2>إدارة الصالون</h2><details><summary>إضافة حلاق</summary>'+form('/new-staff',input('اسم الحلاق','name')+input('اسم الدخول','login')+input('كلمة المرور (12 حرفًا على الأقل)','pass','password','','minlength="12"'),'إضافة الحلاق')+'</details><details><summary>الخدمات والمدد</summary>'+services().map(s=>form('/service',hidden('id',s.id)+input('الخدمة','name','text',s.name)+input('الدقائق','duration','number',s.duration,'min="30" max="480" step="30"'),'حفظ')+form('/service-remove',hidden('id',s.id),'إزالة الخدمة')).join('')+form('/service',input('اسم خدمة جديدة','name')+input('الدقائق','duration','number',30,'min="30" max="480" step="30"'),'إضافة الخدمة')+'</details><details><summary>حالة رسائل الحجوزات</summary>'+all('SELECT booking,kind,state FROM outbox ORDER BY id DESC LIMIT 30').map(m=>'<p>حجز '+m.booking+' · '+({book:'تأكيد',move:'تغيير',cancel:'إلغاء',reminder:'تذكير'}[m.kind])+' · '+({waiting:'بانتظار الإرسال',sent:live?'قُبلت لدى المزوّد':'محاكاة محلية',failed:'تعذّر الإرسال',obsolete:'تجاوزها تعديل'}[m.state])+'</p>').join('')+'</details></section>';}
 return page(owner?'لوحة المالك':'مواعيدي',html);}


function go(path){location.hash='!'+path;render();scrollTo(0,0);}
function render(){
 const path=location.hash.startsWith('#!')?location.hash.slice(2):'/';
 const url=new URL(path,'https://demo.invalid'),p=Object.fromEntries(url.searchParams);
 const staff=path.startsWith('/owner')||path.startsWith('/barber/');
 let html;
 if(url.pathname==='/book')html=book(p);
 else if(url.pathname==='/challenge'&&pending)html=page('تأكيد الجوال','<section><h1>تأكيد تجريبي</h1><p>رمز التجربة 123456</p>'+form('/verify',input('الرمز','code'),'تأكيد الحجز')+'</section>');
 else if(staff){actor=url.pathname==='/owner'?{name:'المالك',role:'owner'}:one('',Number(url.pathname.split('/')[2]));html=actor.role?dashboard(actor,p):landing();}
 else if(url.pathname==='/staff'){html=page('دخول الفريق','<section><h1>جرّب لوحة الفريق</h1>'+link('/owner','المالك')+staffList().map(b=>link('/barber/'+b.id,b.name)).join(' ')+'</section>');}
 else if(['/manage','/appointment'].includes(url.pathname)){const b=data.rows.find(r=>r.secret===p.k||r.id===+p.id);html=b?management(b,url.pathname==='/appointment'?{role:'owner'}:null,p.day):landing();}
 else html=landing();
 const parsed=new DOMParser().parseFromString(html,'text/html');
 document.body.className=parsed.body.className;
 document.body.innerHTML=parsed.body.innerHTML;
 document.title=parsed.title+' · تجربة';
 document.querySelector('footer').textContent='نسخة تجريبية · البيانات محفوظة في هذا المتصفح فقط';
 document.querySelectorAll('a').forEach(a=>{const href=a.getAttribute('href');if(href?.startsWith('/#'))a.href='#'+href.slice(2);else if(href?.startsWith('/'))a.href='#!'+href;else if(href?.startsWith('?'))a.href='#!'+url.pathname+href;});
 const theme=document.querySelector('.theme-toggle');theme.hidden=false;theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';};
 const name=document.querySelector('[name=customer]'),phone=document.querySelector('[name=phone]');if(name&&phone){name.value='زبون تجريبي';phone.value='0550000000';phone.readOnly=true;}
 if(staff)document.querySelectorAll('input[type=password]').forEach(x=>{x.required=false;x.disabled=true;x.placeholder='معطّل في العرض التجريبي';});
}
addEventListener('hashchange',()=>{render();if(location.hash&&!location.hash.startsWith('#!'))document.getElementById(location.hash.slice(1))?.scrollIntoView();});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,p=Object.fromEntries(new FormData(f)),route=(location.hash.slice(2)||'/').split('?')[0],action=f.getAttribute('action')||route;
 if(f.method==='get')return go(action+'?'+new URLSearchParams(p));
 let dest=actor?.role==='owner'?'/owner':'/barber/'+actor?.id;
 if(action==='/challenge'){pending=p;return go('/challenge');}
 if(action==='/verify'){if(!pending||p.code!=='123456')return alert('أدخل رمز التجربة 123456');const s=services().find(x=>x.id===+pending.service),t=+pending.start;if(!slots(+pending.barber,s.duration,dayOf(t)).includes(t))return go('/book');const id=Date.now();data.rows.push({id,secret:String(id),customer:pending.customer,phone:'0550000000',barber:+pending.barber,service:s.name,minutes:s.duration,start:t,status:'booked',reply:'pending'});pending=null;dest='/manage?k='+id;}
 if(action==='/logout')dest='/staff';
 if(action==='/change'){const b=data.rows.find(r=>r.id===+p.id);if(!b||b.status!=='booked')return;if(p.action==='move'){if(!slots(b.barber,b.minutes,dayOf(+p.start),b.id).includes(+p.start))return alert('الوقت غير متاح');b.start=+p.start;}else if(p.action==='confirm')b.reply='yes';else b.status=({done:'done',absent:'absent',cancel:'cancelled'})[p.action];dest=p.k?'/manage?k='+p.k:'/appointment?id='+b.id;}
 if(action==='/schedule'){if(+p.opens>=+p.closes)return alert('راجع ساعات الدوام');Object.assign(one('',+p.id),{days:Array.from({length:7},(_,i)=>p['d'+i]?i:'').join(''),opens:+p.opens,closes:+p.closes});dest+='?tab=team';}
 if(action==='/staff-edit')one('',+p.id).name=p.name;
 if(action==='/archive')data.team=data.team.filter(x=>x.id!==+p.id);
 if(action==='/new-staff')data.team.push({id:Date.now(),name:p.name,role:'barber',days:'0123456',opens:600,closes:1320});
 if(action==='/service'){const s=data.menu.find(x=>x.id===+p.id);if(s)Object.assign(s,{name:p.name,duration:+p.duration});else data.menu.push({id:Date.now(),name:p.name,duration:+p.duration});}
 if(action==='/service-remove')data.menu=data.menu.filter(x=>x.id!==+p.id);
 localStorage.setItem(storeKey,JSON.stringify(data));go(dest);});
render();
</script></body></html>
