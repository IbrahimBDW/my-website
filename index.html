<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موقعي الأول</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f7ff;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #2563eb;
    }

    button {
      background-color: #2563eb;
      color: red;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>أهلًا بك في موقعي!</h1>
  <p>هذا أول موقع أسويه بنفسي 😎</p>

  <button onclick="showMessage()">اضغط هنا</button>

  <script>
    function showMessage() {
      alert("شكرًا لزيارتك موقعي!");
    }
  </script>
</body>
</html>
